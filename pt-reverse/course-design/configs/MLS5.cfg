hostname MLS5
ip routing
no ip domain-lookup
! VLAN definitions
vlan 62
 name LAB_C
exit
vlan 63
 name LAB_D
exit
! SVI gateways
interface Vlan62
 description 学生实验电脑-C gateway
 ip address 192.168.4.254 255.255.255.0
 no shutdown
exit
interface Vlan63
 description 学生实验电脑-D gateway
 ip address 192.168.5.254 255.255.255.0
 no shutdown
exit
! Access-switch trunks
interface FastEthernet0/1
 description trunk to VLAN 62 access switch
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 62
 no shutdown
exit
interface FastEthernet0/2
 description trunk to VLAN 63 access switch
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 63
 no shutdown
exit
! Routed inter-MLS links
interface GigabitEthernet0/1
 description L3 link to MLS4 10.10.45.0/30
 no switchport
 ip address 10.10.45.2 255.255.255.252
 no shutdown
exit
interface GigabitEthernet0/2
 description L3 link to MLS6 10.10.56.0/30
 no switchport
 ip address 10.10.56.1 255.255.255.252
 no shutdown
exit
! Dynamic routing
router rip
 version 2
 no auto-summary
 network 10.0.0.0
 network 192.168.0.0
exit
end
write memory
