hostname MLS1
ip routing
no ip domain-lookup
! VLAN definitions
vlan 10
 name SERVER
exit
vlan 20
 name OFFICE
exit
! SVI gateways
interface Vlan10
 description 服务器区 gateway
 ip address 172.16.1.62 255.255.255.192
 no shutdown
exit
interface Vlan20
 description 办公用计算机 gateway
 ip address 192.168.0.62 255.255.255.192
 no shutdown
exit
! Access-switch trunks
interface FastEthernet0/1
 description trunk to VLAN 10 access switch
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10
 no shutdown
exit
interface FastEthernet0/2
 description trunk to VLAN 20 access switch
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 20
 no shutdown
exit
! Routed inter-MLS links
interface GigabitEthernet0/1
 description L3 link to MLS2 10.10.12.0/30
 no switchport
 ip address 10.10.12.1 255.255.255.252
 no shutdown
exit
interface GigabitEthernet0/2
 description L3 link to MLS6 10.10.61.0/30
 no switchport
 ip address 10.10.61.2 255.255.255.252
 no shutdown
exit
! Dynamic routing
router rip
 version 2
 no auto-summary
 network 10.0.0.0
 network 192.168.0.0
 network 172.16.0.0
exit
end
write memory
