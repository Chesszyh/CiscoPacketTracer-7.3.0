hostname MLS4
ip routing
no ip domain-lookup
! VLAN definitions
vlan 60
 name LAB_A
exit
vlan 61
 name LAB_B
exit
! SVI gateways
interface Vlan60
 description 学生实验电脑-A gateway
 ip address 192.168.2.254 255.255.255.0
 no shutdown
exit
interface Vlan61
 description 学生实验电脑-B gateway
 ip address 192.168.3.254 255.255.255.0
 no shutdown
exit
! Access-switch trunks
interface FastEthernet0/1
 description trunk to VLAN 60 access switch
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 60
 no shutdown
exit
interface FastEthernet0/2
 description trunk to VLAN 61 access switch
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 61
 no shutdown
exit
! Routed inter-MLS links
interface GigabitEthernet0/1
 description L3 link to MLS3 10.10.34.0/30
 no switchport
 ip address 10.10.34.2 255.255.255.252
 no shutdown
exit
interface GigabitEthernet0/2
 description L3 link to MLS5 10.10.45.0/30
 no switchport
 ip address 10.10.45.1 255.255.255.252
 no shutdown
exit
! Dynamic routing
router rip
 version 2
 no auto-summary
 network 10.0.0.0
 network 192.168.0.0
exit
end
write memory
