hostname MLS3
ip routing
no ip domain-lookup
! VLAN definitions
vlan 50
 name GRADUATE
exit
! SVI gateways
interface Vlan50
 description 研究生计算机 gateway
 ip address 192.168.1.254 255.255.255.0
 no shutdown
exit
! Access-switch trunks
interface FastEthernet0/1
 description trunk to VLAN 50 access switch
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 50
 no shutdown
exit
! Routed inter-MLS links
interface GigabitEthernet0/1
 description L3 link to MLS2 10.10.23.0/30
 no switchport
 ip address 10.10.23.2 255.255.255.252
 no shutdown
exit
interface GigabitEthernet0/2
 description L3 link to MLS4 10.10.34.0/30
 no switchport
 ip address 10.10.34.1 255.255.255.252
 no shutdown
exit
! Dynamic routing
router rip
 version 2
 no auto-summary
 network 10.0.0.0
 network 192.168.0.0
exit
end
write memory
