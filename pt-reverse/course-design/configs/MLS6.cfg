hostname MLS6
ip routing
no ip domain-lookup
! VLAN definitions
vlan 64
 name LAB_E
exit
vlan 65
 name LAB_F
exit
! SVI gateways
interface Vlan64
 description 学生实验电脑-E gateway
 ip address 192.168.6.254 255.255.255.0
 no shutdown
exit
interface Vlan65
 description 学生实验电脑-F gateway
 ip address 192.168.7.254 255.255.255.0
 no shutdown
exit
! Access-switch trunks
interface FastEthernet0/1
 description trunk to VLAN 64 access switch
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 64
 no shutdown
exit
interface FastEthernet0/2
 description trunk to VLAN 65 access switch
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 65
 no shutdown
exit
! Routed inter-MLS links
interface GigabitEthernet0/1
 description L3 link to MLS5 10.10.56.0/30
 no switchport
 ip address 10.10.56.2 255.255.255.252
 no shutdown
exit
interface GigabitEthernet0/2
 description L3 link to MLS1 10.10.61.0/30
 no switchport
 ip address 10.10.61.1 255.255.255.252
 no shutdown
exit
! Dynamic routing
router rip
 version 2
 no auto-summary
 network 10.0.0.0
 network 192.168.0.0
exit
end
write memory
