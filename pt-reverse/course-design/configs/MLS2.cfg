hostname MLS2
ip routing
no ip domain-lookup
! VLAN definitions
vlan 30
 name TEACHING
exit
vlan 40
 name RESEARCH
exit
! SVI gateways
interface Vlan30
 description 教学用计算机 gateway
 ip address 192.168.0.126 255.255.255.192
 no shutdown
exit
interface Vlan40
 description 科研用计算机 gateway
 ip address 192.168.0.254 255.255.255.128
 no shutdown
exit
! Access-switch trunks
interface FastEthernet0/1
 description trunk to VLAN 30 access switch
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 30
 no shutdown
exit
interface FastEthernet0/2
 description trunk to VLAN 40 access switch
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 40
 no shutdown
exit
! Routed inter-MLS links
interface GigabitEthernet0/1
 description L3 link to MLS1 10.10.12.0/30
 no switchport
 ip address 10.10.12.2 255.255.255.252
 no shutdown
exit
interface GigabitEthernet0/2
 description L3 link to MLS3 10.10.23.0/30
 no switchport
 ip address 10.10.23.1 255.255.255.252
 no shutdown
exit
! Dynamic routing
router rip
 version 2
 no auto-summary
 network 10.0.0.0
 network 192.168.0.0
exit
end
write memory
